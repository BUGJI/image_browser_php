<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>素材库 · 图片浏览器</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <button class="menu-toggle" data-icon="menu" data-icon-size="20" onclick="toggleSidebar()" aria-label="菜单"></button>

    <div class="app">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>
                    <span class="title-icon" data-icon="folder" data-icon-size="16"></span>
                    <span>图片目录</span>
                </h2>
                <input type="text" id="folderFilter" placeholder="筛选文件夹...">
            </div>
            <div class="folder-tree" id="folderTree">
                <div class="folder-loading"><div class="spinner"></div><div>加载目录...</div></div>
            </div>
            <div class="cache-info" id="cacheInfo">
                <span id="cacheUpdatedAt"></span>
                <span onclick="clearCacheAndReload()">清除缓存</span>
            </div>
        </div>

        <div class="main-content">
            <div class="toolbar">
                <div class="current-path" id="currentPath">/</div>
                <span id="imageCount" class="image-count"></span>
                <button class="btn btn-icon theme-toggle" id="themeToggle" data-icon="moon" data-icon-size="16" title="切换亮色/暗色主题"></button>
                <button class="btn btn-icon" id="viewToggle" data-icon="masonry" data-icon-size="16" title="视图：瀑布流（点击切换为正方形）"></button>
                <input type="range" id="zoomSlider" min="0.5" max="7" step="0.1" value="1" title="缩放">
                <div class="search-field">
                    <span class="search-field-icon" data-icon="search" data-icon-size="14"></span>
                    <input type="text" id="imageSearch" class="search-box" placeholder="搜索图片">
                    <button class="search-clear" id="searchClear" data-icon="x" data-icon-size="13" hidden title="清除"></button>
                </div>
                <button class="btn btn-icon" id="refreshBtn" data-icon="refresh" data-icon-size="16" title="刷新"></button>
            </div>

            <div class="masonry-scroll" id="masonryScroll">
                <div class="masonry-spacer" id="masonrySpacer"></div>
                <div class="masonry-viewport" id="masonryViewport"></div>
            </div>
        </div>
    </div>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox" onclick="closeLightboxOnBg(event)">
        <button class="lightbox-close" data-icon="x" data-icon-size="24" onclick="closeLightbox()" title="关闭"></button>
        <button class="lightbox-nav lightbox-prev" data-icon="chevronLeft" data-icon-size="30" onclick="event.stopPropagation();navLightbox(-1)" title="上一张"></button>
        <button class="lightbox-nav lightbox-next" data-icon="chevronRight" data-icon-size="30" onclick="event.stopPropagation();navLightbox(1)" title="下一张"></button>
        <div class="lightbox-original-badge" id="lightboxBadge"></div>
        <div class="lightbox-loading-toast" id="lightboxLoadingToast" style="display: none;">
            <div class="spinner-small"></div>
            <span>加载原图中...</span>
        </div>
        <div class="zoom-hint" id="zoomHint"><span data-icon="zoomIn" data-icon-size="13"></span> 滚动滚轮缩放 | 双击重置</div>
        <div class="lightbox-img-container" id="lightboxContainer">
            <img class="lightbox-img" id="lightboxImg" src="" draggable="false">
        </div>
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
